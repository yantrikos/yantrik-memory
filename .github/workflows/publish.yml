name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip build
          pip install -e .
          python -c "import yantrik_memory"
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
